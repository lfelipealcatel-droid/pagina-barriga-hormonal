    <!-- Remove nome/medidas da URL antes do Pixel (guarda em sessionStorage) -->
    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          var keys = ['nome', 'cm_min', 'cm_max'];
          var found = false;
          var perfil = {};
          for (var i = 0; i < keys.length; i++) {
            var v = url.searchParams.get(keys[i]);
            perfil[keys[i]] = v;
            if (v !== null) found = true;
          }
          if (found) {
            try {
              sessionStorage.setItem('vittalle_perfil', JSON.stringify(perfil));
            } catch (e) {}
            for (var j = 0; j < keys.length; j++) url.searchParams.delete(keys[j]);
            var qs = url.searchParams.toString();
            history.replaceState(history.state, '', url.pathname + (qs ? '?' + qs : '') + url.hash);
          }
        } catch (e) {}
      })();
    </script>
